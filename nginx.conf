server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Laravel accepts 2 MB per image; allow multi-image admin forms.
    client_max_body_size 20m;

    # Re-resolve the backend after a container recreate changes its IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:80;

    # Laravel API, Sanctum CSRF cookie, and uploaded public files
    location ~ ^/(api|sanctum|storage)/ {
        proxy_pass $backend;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
